<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio Melódico & Gerador MIDI (v1.0.15)</title>
    <script src="https://cdn.jsdelivr.net/npm/midi-writer-js@2.1.4/build/index.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f1117 0%, #1a1e29 100%);
            --panel-bg: rgba(26, 30, 42, 0.75);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #6366f1;
            --accent-secondary: #0ea5e9;
            --accent-success: #10b981;
            --accent-success-hover: #059669;
            --accent-danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.12);
            --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 30px 15px; }
        .app-card { background: var(--panel-bg); backdrop-filter: blur(16px); border: 1px solid var(--panel-border); border-radius: 20px; width: 100%; max-width: 680px; padding: 32px; box-shadow: var(--card-shadow); }
        .app-header { text-align: center; margin-bottom: 28px; }
        .app-header h1 { font-size: 1.8rem; font-weight: 700; background: linear-gradient(to right, #a5b4fc, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        .app-header p { color: var(--text-muted); font-size: 0.9rem; }
        .version-badge { display: inline-block; background: rgba(99, 102, 241, 0.2); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.4); padding: 2px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-top: 6px; }
        .section-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-secondary); font-weight: 600; margin: 24px 0 14px 0; display: flex; align-items: center; gap: 8px; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--panel-border); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
        .input-row { display: flex; gap: 8px; align-items: center; }
        select, input[type="text"], input[type="number"] { width: 100%; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 10px; padding: 11px 14px; color: var(--text-main); font-size: 0.92rem; outline: none; }
        select:focus, input:focus { border-color: var(--accent-primary); }
        .btn { background: #2a324b; color: #fff; border: 1px solid var(--panel-border); border-radius: 10px; padding: 11px 16px; font-size: 0.88rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; transition: all 0.2s; }
        .btn:hover { background: #374151; transform: translateY(-1px); }
        .btn-icon { padding: 11px; width: 44px; justify-content: center; background: rgba(255, 255, 255, 0.05); }
        .btn-primary { background: var(--accent-success); color: #fff; width: 100%; padding: 14px; font-size: 1rem; margin-top: 10px; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); }
        .btn-primary:hover { background: var(--accent-success-hover); }
        .btn-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background: var(--accent-danger); color: #fff; }
        .collapsible-panel { max-height: 0; overflow: hidden; transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s; opacity: 0; background: rgba(15, 23, 42, 0.8); border-radius: 12px; border: 1px solid transparent; margin-top: 0; }
        .collapsible-panel.open { max-height: 280px; opacity: 1; padding: 14px; margin-top: 10px; border-color: var(--panel-border); }
        .rhythm-builder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
        .rhythm-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--input-border); color: var(--text-main); padding: 8px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; text-align: center; }
        .rhythm-btn:hover { background: var(--accent-primary); border-color: var(--accent-primary); }
    </style>
</head>
<body>
<div class="app-card">
    <div class="app-header">
        <h1>Estúdio Melódico & Gerador MIDI</h1>
        <p>Crie, personalize e pré-visualize permutações e frases musicais</p>
        <div class="version-badge">Versão v1.0.15</div>
    </div>
    <div class="form-group grid-2">
        <div>
            <label>Tônica Principal</label>
            <select id="tonica">
                <option value="A">A (Lá)</option><option value="A#">A# / Bb</option><option value="B">B (Si)</option>
                <option value="C">C (Dó)</option><option value="C#">C# / Db</option><option value="D">D (Ré)</option>
                <option value="D#">D# / Eb</option><option value="E">E (Mi)</option><option value="F">F (Fá)</option>
                <option value="F#">F# / Gb</option><option value="G">G (Sol)</option><option value="G#">G# / Ab</option>
            </select>
        </div>
        <div>
            <label>Oitava Base</label>
            <input type="number" id="oitava" value="4" min="1" max="7">
        </div>
    </div>
    <div class="form-group">
        <label>Escala</label>
        <div class="input-row">
            <select id="escala-select"></select>
            <button class="btn btn-icon" title="Opções da Escala" onclick="toggleMenu('panel-escala')">⋮</button>
        </div>
        <div id="panel-escala" class="collapsible-panel">
            <div class="form-group"><input type="text" id="esc-nome" placeholder="Nome da Escala"></div>
            <div class="form-group"><input type="text" id="esc-formula" placeholder="Fórmula por graus"></div>
            <div class="input-row">
                <button class="btn" style="flex:1;" onclick="salvarEscala()">Salvar / Atualizar</button>
                <button class="btn btn-danger" onclick="excluirEscala()">Excluir</button>
            </div>
        </div>
    </div>
    <div class="form-group">
        <label>Ritmo / Célula</label>
        <div class="input-row">
            <select id="ritmo-select"></select>
            <button class="btn btn-icon" title="Opções de Ritmo" onclick="toggleMenu('panel-ritmo')">⋮</button>
        </div>
        <div id="panel-ritmo" class="collapsible-panel">
            <div class="form-group"><input type="text" id="rit-nome" placeholder="Nome da Célula Rítmica"></div>
            <label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px;">Construtor Visual (Clique para adicionar):</label>
            <div class="rhythm-builder">
                <button class="rhythm-btn" onclick="addNoteFigure('seminima')">𝅝 Semínima</button>
                <button class="rhythm-btn" onclick="addNoteFigure('colcheia')">♪ Colcheia</button>
                <button class="rhythm-btn" onclick="addNoteFigure('semicolcheia')">𝅘𝅥𝅯 Semicolcheia</button>
                <button class="rhythm-btn" onclick="addNoteFigure('tercina')">𝅘𝅥 Tercina</button>
                <button class="rhythm-btn" onclick="addNoteFigure('minima')">𝅗𝅥 Mínima</button>
                <button class="rhythm-btn" onclick="addNoteFigure('colcheia pontuada, semicolcheia')">♪. + 𝅘𝅥𝅯</button>
                <button class="rhythm-btn" onclick="addNoteFigure('semicolcheia, colcheia pontuada')">𝅘𝅥𝅯 + ♪.</button>
                <button class="rhythm-btn" onclick="clearRhythmFormula()">🗑 Limpar</button>
            </div>
            <div class="form-group"><input type="text" id="rit-formula" placeholder="Fórmula resultante"></div>
            <div class="input-row">
                <button class="btn" style="flex:1;" onclick="salvarRitmo()">Salvar / Atualizar</button>
                <button class="btn btn-danger" onclick="excluirRitmo()">Excluir</button>
            </div>
        </div>
    </div>
    <div class="form-group">
        <label>Padrão Melódico</label>
        <div class="input-row">
            <select id="padrao-select" onchange="atualizarFormulaInput()"></select>
            <button class="btn btn-icon" title="Opções de Padrão" onclick="toggleMenu('panel-padrao')">⋮</button>
        </div>
        <div id="panel-padrao" class="collapsible-panel">
            <div class="form-group"><input type="text" id="pad-nome" placeholder="Nome do Padrão"></div>
            <div class="form-group"><input type="text" id="pad-formula-edit" placeholder="Fórmula por graus"></div>
            <div class="input-row">
                <button class="btn" style="flex:1;" onclick="salvarPadrao()">Salvar / Atualizar</button>
                <button class="btn btn-danger" onclick="excluirPadrao()">Excluir</button>
            </div>
        </div>
    </div>
    <div class="form-group">
        <label>Fórmula Atual (Editável)</label>
        <input type="text" id="padrao-formula" value="1,2,2#,3">
    </div>
    <div class="section-title">Configurações Globais</div>
    <div class="grid-2 form-group">
        <div>
            <label>Nota Inicial (Escala)</label>
            <select id="nota-inicial-select"></select>
        </div>
        <div>
            <label>Direção</label>
            <select id="direcao">
                <option value="asc">Ascendente</option>
                <option value="desc">Descendente</option>
            </select>
        </div>
    </div>
    <div class="grid-3 form-group">
        <div><label>Compassos</label><input type="number" id="compassos" value="2" min="1" max="16"></div>
        <div><label>BPM</label><input type="number" id="bpm" value="120" min="40" max="240"></div>
        <div>
            <label>Fórmula Compasso</label>
            <select id="time-sig"><option value="4/4">4/4</option><option value="3/4">3/4</option><option value="6/8">6/8</option></select>
        </div>
    </div>
    <button class="btn btn-primary" onclick="gerarEBaixarMIDI()">Gerar e Baixar MIDI</button>
</div>
<script>
    let ESCALAS = {"Menor Harm\u00f4nica": "1,2,3b,4,5,6b,7", "Menor Natural (E\u00f3lica)": "1,2,3b,4,5,6b,7b", "Menor Mel\u00f3dica": "1,2,3b,4,5,6,7", "Maior (J\u00f4nica)": "1,2,3,4,5,6,7", "D\u00f3rica": "1,2,3b,4,5,6,7b", "Fr\u00edgia": "1,2b,3b,4,5,6b,7b", "L\u00eddia": "1,2,3,4#,5,6,7", "Mixol\u00eddia": "1,2,3,4,5,7b", "Blues": "1,3b,4,4#,5,7b", "Dominante Bebop": "1,2,3,4,5,6,7b,7", "H\u00fangara Menor": "1,2,3b,4#,5,6b,7"};
    let RITMOS = {"Tercinas de Colcheia": "tercina", "Sextina (6 semicolcheias)": "sextina", "Sem\u00ednima (1t)": "seminima", "Sem\u00ednima Pontuada (1.5t)": "seminima_pontuada", "M\u00ednima (2t)": "minima", "M\u00ednima Pontuada (3t)": "minima_pontuada", "Colcheia Pontuada + Semicolcheia": "colcheia pontuada, semicolcheia", "Semicolcheia + Colcheia Pontuada": "semicolcheia, colcheia pontuada", "Colcheia + 2 Semicolcheias": "colcheia, semicolcheia, semicolcheia", "2 Semicolcheias + Colcheia": "semicolcheia, semicolcheia, colcheia", "Semicolcheia + Colcheia + Semicolcheia": "semicolcheia, colcheia, semicolcheia", "Sem\u00ednima Pontuada + Colcheia": "seminima pontuada, colcheia", "M\u00ednima Pontuada + Sem\u00ednima": "minima pontuada, seminima", "Sem\u00ednima + M\u00ednima Pontuada": "seminima, minima pontuada"};
    let PADROES = {"Crom\u00e1tico Tenso": "1,2,2#,3", "Linear Simples": "1,2,3", "Salto de Ter\u00e7a (1-3-2-4)": "1,3,2,4", "Giro em Torno do Grau (1-2-1-7b)": "1,2,1,7b", "Aproxima\u00e7\u00e3o Inferior (7b-1-2-3)": "7b,1,2,3", "Arpejo Ascendente (1-3-5-7)": "1,3,5,7"};

    function init() {
        renderSelects();
    }
    function renderSelects() {
        populateSelect('escala-select', ESCALAS);
        populateSelect('ritmo-select', RITMOS);
        populateSelect('padrao-select', PADROES);
    }
    function populateSelect(id, dict) {
        const sel = document.getElementById(id);
        const currVal = sel.value;
        sel.innerHTML = '';
        for (let key in dict) {
            let opt = document.createElement('option');
            opt.value = key;
            opt.innerText = key;
            sel.appendChild(opt);
        }
        if (dict[currVal]) sel.value = currVal;
    }
    function toggleMenu(panelId) {
        const p = document.getElementById(panelId);
        const isOpen = p.classList.contains('open');
        document.querySelectorAll('.collapsible-panel').forEach(el => el.classList.remove('open'));
        if (!isOpen) p.classList.add('open');
    }
    function addNoteFigure(fig) {
        const input = document.getElementById('rit-formula');
        input.value = input.value ? input.value + ', ' + fig : fig;
    }
    function clearRhythmFormula() { document.getElementById('rit-formula').value = ''; }
    function atualizarFormulaInput() {
        const sel = document.getElementById('padrao-select').value;
        document.getElementById('padrao-formula').value = PADROES[sel] || '1,2,3';
    }
    window.onload = init;
</script>
</body>
</html>
