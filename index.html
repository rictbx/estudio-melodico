<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio Melódico & Gerador MIDI (v1.0.20)</title>
    <script src="https://cdn.jsdelivr.net/npm/midi-writer-js@2.1.4/build/index.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f1117 0%, #1a1e29 100%);
            --panel-bg: rgba(26, 30, 42, 0.75);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #6366f1;
            --accent-secondary: #0ea5e9;
            --accent-success: #10b981;
            --accent-success-hover: #059669;
            --accent-danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.12);
            --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 30px 15px; }
        .app-card { background: var(--panel-bg); backdrop-filter: blur(16px); border: 1px solid var(--panel-border); border-radius: 20px; width: 100%; max-width: 680px; padding: 32px; box-shadow: var(--card-shadow); }
        .app-header { text-align: center; margin-bottom: 28px; }
        .app-header h1 { font-size: 1.8rem; font-weight: 700; background: linear-gradient(to right, #a5b4fc, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        .app-header p { color: var(--text-muted); font-size: 0.9rem; }
        .version-badge { display: inline-block; background: rgba(99, 102, 241, 0.2); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.4); padding: 2px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-top: 6px; }
        .section-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-secondary); font-weight: 600; margin: 24px 0 14px 0; display: flex; align-items: center; gap: 8px; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--panel-border); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
        .input-row { display: flex; gap: 8px; align-items: center; }
        select, input[type="text"], input[type="number"] { width: 100%; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 10px; padding: 11px 14px; color: var(--text-main); font-size: 0.92rem; outline: none; }
        select:focus, input:focus { border-color: var(--accent-primary); }
        .btn { background: #2a324b; color: #fff; border: 1px solid var(--panel-border); border-radius: 10px; padding: 11px 16px; font-size: 0.88rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; transition: all 0.2s; }
        .btn:hover { background: #374151; transform: translateY(-1px); }
        .btn-icon { padding: 11px; width: 44px; justify-content: center; background: rgba(255, 255, 255, 0.05); }
        .btn-primary { background: var(--accent-success); color: #fff; width: 100%; padding: 14px; font-size: 1rem; margin-top: 10px; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); }
        .btn-primary:hover { background: var(--accent-success-hover); }
        .btn-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background: var(--accent-danger); color: #fff; }
        .collapsible-panel { max-height: 0; overflow: hidden; transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s; opacity: 0; background: rgba(15, 23, 42, 0.85); border-radius: 12px; border: 1px solid transparent; margin-top: 0; }
        .collapsible-panel.open { max-height: 380px; opacity: 1; padding: 14px; margin-top: 10px; border-color: var(--panel-border); }
        .rhythm-builder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
        .rhythm-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--input-border); color: var(--text-main); padding: 8px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; text-align: center; }
        .rhythm-btn:hover { background: var(--accent-primary); border-color: var(--accent-primary); }
    </style>
</head>
<body>
<div class="app-card">
    <div class="app-header">
        <h1>Estúdio Melódico & Gerador MIDI</h1>
        <p>Crie, personalize e pré-visualize permutações e frases musicais</p>
        <div class="version-badge">Versão v1.0.20</div>
    </div>
    <div class="form-group grid-2">
        <div>
            <label>Tônica Principal</label>
            <select id="tonica" onchange="atualizarNotasWeb()">
                <option value="A">A (Lá)</option><option value="A#">A# / Bb</option><option value="B">B (Si)</option>
                <option value="C">C (Dó)</option><option value="C#">C# / Db</option><option value="D">D (Ré)</option>
                <option value="D#">D# / Eb</option><option value="E">E (Mi)</option><option value="F">F (Fá)</option>
                <option value="F#">F# / Gb</option><option value="G">G (Sol)</option><option value="G#">G# / Ab</option>
            </select>
        </div>
        <div>
            <label>Oitava Base</label>
            <input type="number" id="oitava" value="4" min="1" max="7" onchange="atualizarNotasWeb()">
        </div>
    </div>

    <!-- ESCALA -->
    <div class="form-group">
        <label>Escala</label>
        <div class="input-row">
            <select id="escala-select" onchange="aoMudarEscala()"></select>
            <button class="btn btn-icon" title="Opções da Escala" onclick="toggleMenu('panel-escala')">⋮</button>
        </div>
        <div id="panel-escala" class="collapsible-panel" style="border: 1px solid #007bff;">
            <div style="font-size:0.82rem; font-weight:600; color:#38bdf8; margin-bottom:8px;">Opções para Escalas:</div>
            <div class="form-group"><input type="text" id="esc-nome" placeholder="Nome da Escala"></div>
            <div class="form-group"><input type="text" id="esc-formula" placeholder="Ex: 1,2,3,4,5,6,7"></div>
            <div class="input-row">
                <button class="btn" style="flex:1; background:#007bff;" onclick="salvarEscalaWeb()">+ Salvar / Atualizar</button>
                <button class="btn btn-danger" onclick="excluirEscalaWeb()">Excluir</button>
            </div>
        </div>
    </div>

    <!-- RITMO -->
    <div class="form-group">
        <label>Ritmo / Célula</label>
        <div class="input-row">
            <select id="ritmo-select" onchange="aoMudarRitmo()"></select>
            <button class="btn btn-icon" title="Opções de Ritmo" onclick="toggleMenu('panel-ritmo')">⋮</button>
        </div>
        <div id="panel-ritmo" class="collapsible-panel" style="border: 1px solid #28a745;">
            <div style="font-size:0.82rem; font-weight:600; color:#28a745; margin-bottom:8px;">Opções e Construtor Visual de Ritmos:</div>
            <div class="form-group"><input type="text" id="rit-nome" placeholder="Nome da Célula Rítmica"></div>
            <label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px;">Construtor Visual (Clique para adicionar):</label>
            <div class="rhythm-builder">
                <button class="rhythm-btn" onclick="addNoteFigure('seminima')">𝅝 Semínima</button>
                <button class="rhythm-btn" onclick="addNoteFigure('colcheia')">♪ Colcheia</button>
                <button class="rhythm-btn" onclick="addNoteFigure('semicolcheia')">𝅘𝅥𝅯 Semicolcheia</button>
                <button class="rhythm-btn" onclick="addNoteFigure('tercina')">𝅘𝅥 Tercina</button>
                <button class="rhythm-btn" onclick="addNoteFigure('minima')">𝅗𝅥 Mínima</button>
                <button class="rhythm-btn" onclick="addNoteFigure('colcheia pontuada, semicolcheia')">♪. + 𝅘𝅥𝅯</button>
                <button class="rhythm-btn" onclick="addNoteFigure('semicolcheia, colcheia pontuada')">𝅘𝅥𝅯 + ♪.</button>
                <button class="rhythm-btn" onclick="clearRhythmFormula()" style="background:rgba(239,68,68,0.2); color:#fca5a5;">🗑 Limpar</button>
            </div>
            <div class="form-group"><input type="text" id="rit-formula" placeholder="Fórmula resultante"></div>
            <div class="input-row">
                <button class="btn" style="flex:1; background:#28a745;" onclick="salvarRitmoWeb()">+ Salvar / Atualizar</button>
                <button class="btn btn-danger" onclick="excluirRitmoWeb()">Excluir</button>
            </div>
        </div>
    </div>

    <!-- PADRÃO -->
    <div class="form-group">
        <label>Padrão Melódico</label>
        <div class="input-row">
            <select id="padrao-select" onchange="aoMudarPadrao()"></select>
            <button class="btn btn-icon" title="Opções de Padrão" onclick="toggleMenu('panel-padrao')">⋮</button>
        </div>
        <div id="panel-padrao" class="collapsible-panel" style="border: 1px solid #ffc107;">
            <div style="font-size:0.82rem; font-weight:600; color:#ffc107; margin-bottom:8px;">Opções para Padrões:</div>
            <div class="form-group"><input type="text" id="pad-nome" placeholder="Nome do Padrão"></div>
            <div class="form-group"><input type="text" id="pad-formula-edit" placeholder="Ex: 1,2,2#,3"></div>
            <div class="input-row">
                <button class="btn" style="flex:1; background:#d97706; color:#fff;" onclick="salvarPadraoWeb()">+ Salvar / Atualizar</button>
                <button class="btn btn-danger" onclick="excluirPadraoWeb()">Excluir</button>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label>Fórmula Atual (Editável)</label>
        <input type="text" id="padrao-formula" value="1,2,2#,3">
    </div>

    <div class="section-title">Controles de Áudio Web</div>
    <div class="grid-2 form-group">
        <button class="btn" id="btn-ouvir-escala-web" style="background:#0ea5e9; color:#fff;" onclick="tocarEscalaWeb()">▶ Ouvir Escala</button>
        <button class="btn" id="btn-ouvir-prog-web" style="background:#6366f1; color:#fff;" onclick="tocarProgressaoWeb()">▶ Ouvir Progressão</button>
    </div>

    <div class="section-title">Configurações Globais</div>
    <div class="grid-2 form-group">
        <div>
            <label>Nota Inicial (Escala)</label>
            <select id="nota-inicial-select"></select>
        </div>
        <div>
            <label>Direção</label>
            <select id="direcao">
                <option value="asc">Ascendente</option>
                <option value="desc">Descendente</option>
            </select>
        </div>
    </div>
    <div class="grid-3 form-group">
        <div><label>Compassos</label><input type="number" id="compassos" value="2" min="1" max="16"></div>
        <div><label>BPM</label><input type="number" id="bpm" value="120" min="40" max="240"></div>
        <div>
            <label>Fórmula Compasso</label>
            <select id="time-sig"><option value="4/4">4/4</option><option value="3/4">3/4</option><option value="6/8">6/8</option></select>
        </div>
    </div>
    <button class="btn btn-primary" onclick="gerarEBaixarMIDI()">Gerar e Baixar MIDI</button>
</div>

<script>
    let ESCALAS = {"Menor Harm\u00f4nica": "1,2,3b,4,5,6b,7", "Menor Natural (E\u00f3lica)": "1,2,3b,4,5,6b,7b", "Menor Mel\u00f3dica": "1,2,3b,4,5,6,7", "Maior (J\u00f4nica)": "1,2,3,4,5,6,7", "D\u00f3rica": "1,2,3b,4,5,6,7b", "Fr\u00edgia": "1,2b,3b,4,5,6b,7b", "L\u00eddia": "1,2,3,4#,5,6,7", "Mixol\u00eddia": "1,2,3,4,5,7b", "Blues": "1,3b,4,4#,5,7b", "Dominante Bebop": "1,2,3,4,5,6,7b,7", "H\u00fangara Menor": "1,2,3b,4#,5,6b,7"};
    let RITMOS = {"Tercinas de Colcheia": "tercina", "Sextina (6 semicolcheias)": "sextina", "Sem\u00ednima (1t)": "seminima", "Sem\u00ednima Pontuada (1.5t)": "seminima_pontuada", "M\u00ednima (2t)": "minima", "M\u00ednima Pontuada (3t)": "minima_pontuada", "Colcheia Pontuada + Semicolcheia": "colcheia pontuada, semicolcheia", "Semicolcheia + Colcheia Pontuada": "semicolcheia, colcheia pontuada", "Colcheia + 2 Semicolcheias": "colcheia, semicolcheia, semicolcheia", "2 Semicolcheias + Colcheia": "semicolcheia, semicolcheia, colcheia", "Semicolcheia + Colcheia + Semicolcheia": "semicolcheia, colcheia, semicolcheia", "Sem\u00ednima Pontuada + Colcheia": "seminima pontuada, colcheia", "M\u00ednima Pontuada + Sem\u00ednima": "minima pontuada, seminima", "Sem\u00ednima + M\u00ednima Pontuada": "seminima, minima pontuada"};
    let PADROES = {"Crom\u00e1tico Tenso": "1,2,2#,3", "Linear Simples": "1,2,3", "Salto de Ter\u00e7a (1-3-2-4)": "1,3,2,4", "Giro em Torno do Grau (1-2-1-7b)": "1,2,1,7b", "Aproxima\u00e7\u00e3o Inferior (7b-1-2-3)": "7b,1,2,3", "Arpejo Ascendente (1-3-5-7)": "1,3,5,7"};

    const notaValores = { 'C':0, 'C#':1, 'Db':1, 'D':2, 'D#':3, 'Eb':3, 'E':4, 'F':5, 'F#':6, 'Gb':6, 'G':7, 'G#':8, 'Ab':8, 'A':9, 'A#':10, 'Bb':10, 'B':11 };
    const pianoFreqs = {
        'A0': 27.5, 'A#0': 29.14, 'B0': 30.87,
        'C1': 32.7, 'C#1': 34.65, 'D1': 36.71, 'D#1': 38.89, 'E1': 41.2, 'F1': 43.65, 'F#1': 46.25, 'G1': 49.0, 'G#1': 51.91, 'A1': 55.0, 'A#1': 58.27, 'B1': 61.74,
        'C2': 65.41, 'C#2': 69.3, 'D2': 73.42, 'D#2': 77.78, 'E2': 82.41, 'F2': 87.31, 'F#2': 92.5, 'G2': 98.0, 'G#2': 103.83, 'A2': 110.0, 'A#2': 116.54, 'B2': 123.47,
        'C3': 130.81, 'C#3': 138.59, 'D3': 146.83, 'D#3': 155.56, 'E3': 164.81, 'F3': 174.61, 'F#3': 185.0, 'G3': 196.0, 'G#3': 207.65, 'A3': 220.0, 'A#3': 233.08, 'B3': 246.94,
        'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.0, 'G#4': 415.3, 'A4': 440.0, 'A#4': 466.16, 'B4': 493.88,
        'C5': 523.25, 'C#5': 554.37, 'D5': 587.33, 'D#5': 622.25, 'E5': 659.25, 'F5': 698.46, 'F#5': 739.99, 'G5': 783.99, 'G#5': 830.61, 'A5': 880.0, 'A#5': 932.33, 'B5': 987.77,
        'C6': 1046.5, 'C#6': 1108.73, 'D6': 1174.66, 'D#6': 1244.51, 'E6': 1318.51, 'F6': 1396.91, 'F#6': 1479.98, 'G6': 1567.98, 'G#6': 1661.22, 'A6': 1760.0, 'A#6': 1864.66, 'B6': 1975.53,
        'C7': 2093.0, 'C#7': 2217.46, 'D7': 2349.32, 'D#7': 2489.02, 'E7': 2637.02, 'F7': 2793.83, 'F#7': 2959.96, 'G7': 3135.96, 'G#7': 3322.44, 'A7': 3520.0, 'A#7': 3729.31, 'B7': 3951.07,
        'C8': 4186.01
    };

    function init() {
        renderSelects();
        atualizarNotasWeb();
    }
    function renderSelects() {
        populateSelect('escala-select', ESCALAS);
        populateSelect('ritmo-select', RITMOS);
        populateSelect('padrao-select', PADROES);
        aoMudarEscala();
        aoMudarRitmo();
        aoMudarPadrao();
    }
    function populateSelect(id, dict) {
        const sel = document.getElementById(id);
        const currVal = sel.value;
        sel.innerHTML = '';
        for (let key in dict) {
            let opt = document.createElement('option');
            opt.value = key;
            opt.innerText = key;
            sel.appendChild(opt);
        }
        if (dict[currVal]) sel.value = currVal;
    }
    function toggleMenu(panelId) {
        const p = document.getElementById(panelId);
        const isOpen = p.classList.contains('open');
        document.querySelectorAll('.collapsible-panel').forEach(el => el.classList.remove('open'));
        if (!isOpen) {
            p.classList.add('open');
            if (panelId === 'panel-escala') {
                document.getElementById('esc-nome').value = document.getElementById('escala-select').value;
                document.getElementById('esc-formula').value = ESCALAS[document.getElementById('escala-select').value] || '';
            } else if (panelId === 'panel-ritmo') {
                document.getElementById('rit-nome').value = document.getElementById('ritmo-select').value;
                document.getElementById('rit-formula').value = RITMOS[document.getElementById('ritmo-select').value] || '';
            } else if (panelId === 'panel-padrao') {
                document.getElementById('pad-nome').value = document.getElementById('padrao-select').value;
                document.getElementById('pad-formula-edit').value = PADROES[document.getElementById('padrao-select').value] || '';
            }
        }
    }
    function fechar PaineisWeb() {
        document.querySelectorAll('.collapsible-panel').forEach(el => el.classList.remove('open'));
    }

    // Gerenciamento Escala Web
    function salvarEscalaWeb() {
        let n = document.getElementById('esc-nome').value.trim();
        let f = document.getElementById('esc-formula').value.trim();
        if (n && f) {
            ESCALAS[n] = f;
            populateSelect('escala-select', ESCALAS);
            document.getElementById('escala-select').value = n;
            atualizarNotasWeb();
            fecharPaineisWeb();
        }
    }
    function excluirEscalaWeb() {
        let sel = document.getElementById('escala-select').value;
        if (Object.keys(ESCALAS).length > 1) {
            delete ESCALAS[sel];
            populateSelect('escala-select', ESCALAS);
            atualizarNotasWeb();
            fecharPaineisWeb();
        }
    }
    function aoMudarEscala() {
        atualizarNotasWeb();
    }

    // Gerenciamento Ritmo Web
    function salvarRitmoWeb() {
        let n = document.getElementById('rit-nome').value.trim();
        let f = document.getElementById('rit-formula').value.trim();
        if (n && f) {
            RITMOS[n] = f;
            populateSelect('ritmo-select', RITMOS);
            document.getElementById('ritmo-select').value = n;
            fecharPaineisWeb();
        }
    }
    function excluirRitmoWeb() {
        let sel = document.getElementById('ritmo-select').value;
        if (Object.keys(RITMOS).length > 1) {
            delete RITMOS[sel];
            populateSelect('ritmo-select', RITMOS);
            fecharPaineisWeb();
        }
    }
    function aoMudarRitmo() {}
    function addNoteFigure(fig) {
        const input = document.getElementById('rit-formula');
        input.value = input.value ? input.value + ', ' + fig : fig;
    }
    function clearRhythmFormula() { document.getElementById('rit-formula').value = ''; }

    // Gerenciamento Padrão Web
    function salvarPadraoWeb() {
        let n = document.getElementById('pad-nome').value.trim();
        let f = document.getElementById('pad-formula-edit').value.trim();
        if (n && f) {
            PADROES[n] = f;
            populateSelect('padrao-select', PADROES);
            document.getElementById('padrao-select').value = n;
            document.getElementById('padrao-formula').value = f;
            fecharPaineisWeb();
        }
    }
    function excluirPadraoWeb() {
        let sel = document.getElementById('padrao-select').value;
        if (Object.keys(PADROES).length > 1) {
            delete PADROES[sel];
            populateSelect('padrao-select', PADROES);
            document.getElementById('padrao-formula').value = PADROES[document.getElementById('padrao-select').value];
            fecharPaineisWeb();
        }
    }
    function aoMudarPadrao() {
        const sel = document.getElementById('padrao-select').value;
        document.getElementById('padrao-formula').value = PADROES[sel] || '1,2,3';
    }

    // Parser Intervalos de Escala (Sua Fórmula por Graus ex: 1,2,3b,4,5,6b,7)
    function parseEscalaIntervalos(formulaStr) {
        const baseMaj = [0, 2, 4, 5, 7, 9, 11];
        const partes = formulaStr.split(',').map(x => x.trim());
        let interv = [];
        partes.forEach(p => {
            let mod = 0;
            let numStr = p;
            if (p.includes('#')) { mod = 1; numStr = p.replace('#', ''); }
            else if (p.includes('b')) { mod = -1; numStr = p.replace('b', ''); }
            let grauIdx = parseInt(numStr) - 1;
            if (!isNaN(grauIdx) && grauIdx >= 0 && grauIdx < baseMaj.length) {
                interv.push(baseMaj[grauIdx] + mod);
            }
        });
        return interv.length > 0 ? interv : [0, 2, 4, 5, 7, 9, 11];
    }

    function obterNotasEscalaWeb() {
        const tonica = document.getElementById('tonica').value;
        const oitava = parseInt(document.getElementById('oitava').value);
        const tipoEscala = document.getElementById('escala-select').value;
        const formulaStr = ESCALAS[tipoEscala] || '1,2,3,4,5,6,7';
        const interv = parseEscalaIntervalos(formulaStr);
        
        let baseVal = (notaValores[tonica] !== undefined ? notaValores[tonica] : 0) + (oitava + 1) * 12;
        const nomesNotas = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        
        return interv.map(iv => {
            let total = baseVal + iv;
            let oit = Math.floor(total / 12) - 1;
            let nIdx = total % 12;
            return nomesNotas[nIdx] + oit;
        });
    }

    function atualizarNotasWeb() {
        const notas = obterNotasEscalaWeb();
        const sel = document.getElementById('nota-inicial-select');
        sel.innerHTML = '';
        notas.forEach(n => {
            let opt = document.createElement('option');
            opt.value = n;
            opt.innerText = n;
            sel.appendChild(opt);
        });
    }

    let globalAudioCtx = null;
    let globalActiveOscs = [];
    let audioAtivoWeb = null;

    function pararAudioWeb() {
        if (globalActiveOscs) {
            globalActiveOscs.forEach(o => { try { o.stop(); } catch(e) {} });
        }
        globalActiveOscs = [];
        if (globalAudioCtx && globalAudioCtx.state !== 'closed') {
            globalAudioCtx.close();
        }
        audioAtivoWeb = null;
        document.getElementById('btn-ouvir-escala-web').innerText = "▶ Ouvir Escala";
        document.getElementById('btn-ouvir-prog-web').innerText = "▶ Ouvir Progressão";
    }

    function tocarSequenciaWeb(notas, duracoes, bpm, tipo, btnId) {
        if (audioAtivoWeb === tipo) {
            pararAudioWeb();
            return;
        }
        pararAudioWeb();
        audioAtivoWeb = tipo;
        const btn = document.getElementById(btnId);
        btn.innerText = "⏹ Parar " + (tipo === 'escala' ? "Escala" : "Progressão");

        globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (globalAudioCtx.state === 'suspended') globalAudioCtx.resume();

        const secPerBeat = 60.0 / bpm;
        let currTime = 0;
        let totalDurSec = 0;
        duracoes.forEach(d => totalDurSec += (d * secPerBeat));

        notas.forEach((nota, i) => {
            let dur = duracoes[i] * secPerBeat;
            let scheduleTime = globalAudioCtx.currentTime + currTime;
            let osc = globalAudioCtx.createOscillator();
            let gain = globalAudioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = pianoFreqs[nota] || 440;
            
            gain.gain.setValueAtTime(0.2, scheduleTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, scheduleTime + dur);

            osc.connect(gain);
            gain.connect(globalAudioCtx.destination);
            osc.start(scheduleTime);
            osc.stop(scheduleTime + dur);
            globalActiveOscs.push(osc);
            currTime += dur;
        });

        setTimeout(() => {
            if (audioAtivoWeb === tipo) pararAudioWeb();
        }, (totalDurSec + 0.1) * 1000);
    }

    function tocarEscalaWeb() {
        const notas = obterNotasEscalaWeb();
        const duracoes = notas.map(() => 1.0);
        const bpm = parseInt(document.getElementById('bpm').value) || 120;
        tocarSequenciaWeb(notas, duracoes, bpm, 'escala', 'btn-ouvir-escala-web');
    }

    function tocarProgressaoWeb() {
        const notasEscala = obterNotasEscalaWeb();
        const bpm = parseInt(document.getElementById('bpm').value) || 120;
        const compassos = parseInt(document.getElementById('compassos').value) || 2;
        const timeSig = document.getElementById('time-sig').value;
        const temposComp = parseInt(timeSig.split('/')[0]) || 4;
        const direcao = document.getElementById('direcao').value;
        const notaInicial = document.getElementById('nota-inicial-select').value;
        
        let padraoStr = document.getElementById('padrao-formula').value.trim();
        let graus = padraoStr.split(',').map(x => {
            let clean = x.trim();
            let mod = 0;
            if (clean.includes('#')) { mod = 1; clean = clean.replace('#', ''); }
            else if (clean.includes('b')) { mod = -1; clean = clean.replace('b', ''); }
            return { grau: parseInt(clean) - 1, mod: mod };
        });

        let startIndex = notasEscala.indexOf(notaInicial);
        if (startIndex === -1) startIndex = 0;

        let totalNotasDesejadas = compassos * temposComp;
        let passos = Math.max(1, Math.floor(totalNotasDesejadas / graus.length));
        
        let notasFinal = [];
        let duracoesFinal = [];
        let ritmoStr = document.getElementById('rit-formula').value || 'colcheia';
        let itensRitmo = ritmoStr.split(',').map(x => x.trim().toLowerCase());

        let count = 0;
        for (let i = 0; i < passos; i++) {
            let baseIdx = direcao === 'desc' ? startIndex - i : startIndex + i;
            graus.forEach(g => {
                let idxFinal = direcao === 'desc' ? baseIdx - g.grau : baseIdx + g.grau;
                if (idxFinal >= 0 && idxFinal < notasEscala.length) {
                    notasFinal.push(notasEscala[idxFinal]);
                    let rItem = itensRitmo[count % itensRitmo.length];
                    let dur = 1.0;
                    if (rItem.includes('seminima')) dur = 1.0;
                    else if (rItem.includes('colcheia')) dur = 0.5;
                    else if (rItem.includes('semicolcheia')) dur = 0.25;
                    else if (rItem.includes('minima')) dur = 2.0;
                    else if (rItem.includes('tercina')) dur = 0.333;
                    duracoesFinal.push(dur);
                    count++;
                }
            });
        }
        if (notasFinal.length === 0) notasFinal = [notasEscala[0]];
        if (duracoesFinal.length === 0) duracoesFinal = [1.0];

        tocarSequenciaWeb(notasFinal, duracoesFinal, bpm, 'progressao', 'btn-ouvir-prog-web');
    }

    window.onload = init;
</script>
</body>
</html>
